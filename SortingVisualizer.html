<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link rel="stylesheet" href="SortingVisualizer.css">
</head>

<body>

    <header>
        <h1>Sorting Algorithm Visualizer</h1>
        <p>Visualize how different sorting algorithms work</p>
    </header>

    <main>

        <section class="controls">

            <div class="control-group">
                <label for="algorithm">Algorithm</label>

                <select id="algorithm">
                    <option value="bubble">Bubble Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                </select>
            </div>

            <div class="control-group">
                <label for="size">
                    Array Size:
                    <span id="sizeValue">50</span>
                </label>

                <input
                    type="range"
                    id="size"
                    min="10"
                    max="100"
                    value="50"
                >
            </div>

            <div class="control-group">
                <label for="speed">
                    Speed:
                    <span id="speedValue">50</span>
                </label>

                <input
                    type="range"
                    id="speed"
                    min="1"
                    max="100"
                    value="50"
                >
            </div>

            <button id="generateBtn">Generate Array</button>

            <button id="sortBtn">Start Sorting</button>

        </section>

        <section class="visualizer">
            <div id="arrayContainer"></div>
        </section>

        <section class="info">

            <div class="info-card">
                <h2 id="algorithmName">Bubble Sort</h2>

                <p id="description">
                    Bubble Sort repeatedly compares adjacent elements
                    and swaps them if they are in the wrong order.
                </p>

                <div class="complexity">
                    <div>
                        <span>Best</span>
                        <strong id="best">O(n)</strong>
                    </div>

                    <div>
                        <span>Average</span>
                        <strong id="average">O(n²)</strong>
                    </div>

                    <div>
                        <span>Worst</span>
                        <strong id="worst">O(n²)</strong>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>Sorting Algorithm Visualizer</p>
    </footer>

    <script src="SortingVisualizer.js"></script>

</body>
</html>
